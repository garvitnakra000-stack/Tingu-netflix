<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happy Birthday, Tingu ji 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #120608;
      --ink: #fff5f0;
      --pink: #f0a0be;
      --pink-soft: #f5c0d4;
      --rose: #8b3a52;
      --gold: #d4956a;
      --muted: #9e7a84;
      --faint: #7a5a66;
      --card: rgba(139,58,82,0.10);
      --card-border: rgba(228,160,180,0.16);
    }

    html, body {
      background: var(--bg);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    .bg-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 20%, rgba(180,40,70,0.20) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 80%, rgba(120,30,80,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 50% 50%, rgba(90,10,30,0.15) 0%, transparent 60%);
    }
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: 0.25; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 50% { opacity: 0.8; } }

    #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

    .page { position: relative; z-index: 2; max-width: 680px; margin: 0 auto; padding: 0 16px 90px; }

    .preview-pill {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 90;
      background: rgba(212,149,106,0.18); border: 1px solid rgba(212,149,106,0.45);
      color: #f3c9a8; font-size: 11px; letter-spacing: 1px; padding: 5px 12px; border-radius: 99px;
      backdrop-filter: blur(6px);
    }

    /* ── Hero ───────────────────────────── */
    .hero { text-align: center; padding: 64px 8px 26px; }
    .eyebrow { font-size: 10px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-bottom: 18px; font-weight: 300; }
    .hero h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(38px, 10vw, 64px); line-height: 1.1; }
    .hero h1 em { color: var(--pink); font-style: italic; display: block; }
    .hero-sub { margin-top: 14px; font-size: 13px; color: var(--muted); line-height: 1.6; }

    .big-countdown { display: flex; justify-content: center; gap: 10px; margin: 30px auto 6px; }
    .cd-unit {
      min-width: 70px; padding: 14px 6px 10px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(180,60,90,0.18), rgba(212,100,140,0.08));
      border: 1px solid rgba(240,160,190,0.3);
    }
    .cd-num { font-family: 'Playfair Display', serif; font-size: clamp(28px, 8vw, 40px); color: var(--pink-soft); display: block; line-height: 1; }
    .cd-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #c07090; margin-top: 6px; display: block; }

    .ticker {
      min-height: 52px; margin: 22px auto 0; max-width: 460px;
      font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; color: var(--pink-soft);
      transition: opacity 0.5s, transform 0.5s; line-height: 1.5;
    }
    .ticker.out { opacity: 0; transform: translateY(6px); }

    .divider { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 26px auto 30px; max-width: 340px; }
    .divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--rose), transparent); }

    .section-label { text-align: center; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
    .section-sub { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 22px; }

    /* ── Schedule cards ─────────────────── */
    .schedule { display: flex; flex-direction: column; gap: 12px; }
    .slot {
      background: var(--card); border: 1px solid var(--card-border); border-radius: 18px;
      overflow: hidden; transition: border-color 0.3s, background 0.3s;
    }
    .slot.open { border-color: rgba(240,160,190,0.35); background: rgba(139,58,82,0.16); }
    .slot.locked { opacity: 0.55; }
    .slot.new { box-shadow: 0 0 0 1px rgba(240,160,190,0.4), 0 0 30px rgba(200,60,100,0.18); }
    .slot-head { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 16px; background: none; border: 0; text-align: left; }
    .slot.locked .slot-head { cursor: default; }
    .slot-time {
      flex-shrink: 0; width: 56px; padding: 8px 0; border-radius: 12px; text-align: center;
      background: rgba(240,160,190,0.08); border: 1px solid rgba(240,160,190,0.18);
      font-size: 11px; color: var(--pink-soft); line-height: 1.3;
    }
    .slot-time span { display: block; font-size: 18px; }
    .slot-meta { flex: 1; min-width: 0; }
    .slot-title { font-family: 'Playfair Display', serif; font-size: 18px; }
    .slot-hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .slot-status { flex-shrink: 0; font-size: 12px; color: var(--muted); text-align: right; }
    .slot-status .chev { display: inline-block; transition: transform 0.3s; font-size: 16px; color: var(--pink); }
    .slot.open .chev { transform: rotate(180deg); }
    .badge-new { display: inline-block; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; background: var(--pink); color: #3a0f1c; padding: 3px 7px; border-radius: 99px; font-weight: 600; margin-right: 6px; }
    .slot-body { display: none; padding: 4px 16px 22px; }
    .slot.open .slot-body { display: block; animation: rise 0.45s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    .note { font-size: 14px; color: #e9cfd7; line-height: 1.7; text-align: center; margin: 14px auto 0; max-width: 460px; }
    .note.serif { font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 99px;
      background: linear-gradient(135deg, #c2527a, #8b3a52); border: 0; color: #fff; font-size: 14px; font-weight: 500;
      box-shadow: 0 6px 20px rgba(194,82,122,0.3); transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .btn.ghost { background: rgba(240,160,190,0.1); border: 1px solid rgba(240,160,190,0.3); box-shadow: none; }
    .center { text-align: center; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

    /* ── Video ──────────────────────────── */
    .video-frame {
      position: relative; width: min(100%, 320px); aspect-ratio: 9 / 16; margin: 6px auto 0;
      border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--card-border);
    }
    .video-frame img, .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
    .play {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      background: linear-gradient(to top, rgba(18,6,8,0.75), rgba(18,6,8,0.1)); border: 0; color: #fff; font-size: 13px;
    }
    .play-circle { width: 66px; height: 66px; border-radius: 50%; background: rgba(240,160,190,0.9); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #3a0f1c; padding-left: 4px; box-shadow: 0 0 30px rgba(240,160,190,0.5); }

    /* ── Cake ───────────────────────────── */
    .cake-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 34px; }
    .cake { position: relative; width: 220px; }
    .candles { position: absolute; left: 0; right: 0; top: -46px; display: flex; justify-content: center; gap: 18px; z-index: 2; }
    .candle { position: relative; width: 10px; height: 46px; border-radius: 3px; background: repeating-linear-gradient(45deg, #fff5f0 0 6px, #f0a0be 6px 12px); }
    .flame {
      position: absolute; left: 50%; top: -26px; width: 16px; height: 26px; margin-left: -8px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(ellipse at 50% 70%, #fff7c2 0%, #ffcf5a 40%, #ff8a3d 75%, transparent 100%);
      box-shadow: 0 0 18px 6px rgba(255,190,90,0.45); animation: flicker 0.18s ease-in-out infinite alternate; transform-origin: 50% 100%;
      border: 0; padding: 0;
    }
    .flame::after { content: ''; position: absolute; inset: -14px; }
    @keyframes flicker { to { transform: scaleY(1.08) scaleX(0.92) rotate(-2deg); } }
    .candle.out .flame { animation: none; opacity: 0; transform: scale(0.2); transition: all 0.35s; box-shadow: none; }
    .candle.out::after { content: ''; position: absolute; left: 50%; top: -18px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: rgba(220,220,220,0.5); animation: smoke 1.6s ease-out forwards; }
    @keyframes smoke { to { transform: translate(6px, -50px) scale(5); opacity: 0; } }
    .tier { border-radius: 14px 14px 10px 10px; position: relative; margin: 0 auto; }
    .tier.top { width: 160px; height: 62px; background: linear-gradient(#f7c6d6, #e993b3); }
    .tier.bottom { width: 220px; height: 78px; background: linear-gradient(#c2527a, #8b3a52); margin-top: -4px; }
    .tier.top::before, .tier.bottom::before {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 18px; border-radius: 14px 14px 0 0;
      background: radial-gradient(circle at 10px 0, #fff5f0 10px, transparent 11px) 0 0 / 20px 18px repeat-x;
    }
    .tier.bottom::after { content: 'Tingu ji'; position: absolute; inset: 30px 0 0; text-align: center; font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; color: #fff5f0; }
    .plate { width: 260px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.15); margin-top: -4px; }
    .mic-meter { width: 200px; height: 6px; border-radius: 99px; background: rgba(255,255,255,0.08); margin: 18px auto 0; overflow: hidden; display: none; }
    .mic-meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pink), #ffcf5a); transition: width 0.08s; }

    /* ── Song ───────────────────────────── */
    .song-card { text-align: center; }
    .vinyl {
      width: 150px; height: 150px; border-radius: 50%; margin: 6px auto 16px;
      background: radial-gradient(circle, var(--pink) 0 18%, #2a0d14 19% 21%, #1a0a0e 22% 100%);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 6px rgba(255,255,255,0.03);
      animation: spin 4s linear infinite; animation-play-state: paused;
    }
    .vinyl.playing { animation-play-state: running; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .song-progress { width: 100%; max-width: 360px; margin: 14px auto 0; accent-color: var(--pink); }
    .lyrics { max-height: 230px; overflow-y: auto; margin-top: 18px; padding: 10px 6px; scroll-behavior: smooth; mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent); }
    .lyric { font-family: 'Playfair Display', serif; font-size: 17px; color: rgba(255,245,240,0.32); padding: 7px 0; transition: color 0.3s, transform 0.3s; }
    .lyric.active { color: var(--pink-soft); transform: scale(1.06); }
    .timing-tool { margin-top: 22px; padding: 14px; border-radius: 14px; border: 1px dashed rgba(212,149,106,0.5); text-align: left; font-size: 12px; color: #f3c9a8; }
    .timing-tool textarea { width: 100%; min-height: 110px; margin: 8px 0; background: rgba(0,0,0,0.3); color: var(--ink); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px; font: 12px/1.5 monospace; }
    .timing-tool .current { font-size: 15px; color: var(--ink); margin: 8px 0; min-height: 22px; }

    /* ── Carousel ───────────────────────── */
    .carousel { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 26px 30px 30px; margin: 0 -16px; scrollbar-width: none; }
    .carousel::-webkit-scrollbar { display: none; }
    .polaroid {
      flex: 0 0 170px; scroll-snap-align: center; background: #fff5f0; color: #3d1f2e; padding: 9px 9px 12px; border-radius: 6px; border: 0;
      box-shadow: 0 10px 26px rgba(0,0,0,0.4); transform: rotate(var(--tilt)); transition: transform 0.3s cubic-bezier(.2,.9,.3,1.3), box-shadow 0.3s; text-align: center;
    }
    .polaroid img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; border-radius: 2px; }
    .polaroid p { font-family: 'Playfair Display', serif; font-style: italic; font-size: 12px; margin-top: 8px; line-height: 1.35; }
    .polaroid:hover, .polaroid:focus-visible { transform: rotate(0) scale(1.14) translateY(-10px); box-shadow: 0 22px 44px rgba(0,0,0,0.55); z-index: 3; position: relative; }

    /* ── Lightbox ───────────────────────── */
    .lightbox { position: fixed; inset: 0; z-index: 95; background: rgba(10,3,5,0.92); display: none; align-items: center; justify-content: center; flex-direction: column; padding: 24px 16px; }
    .lightbox.show { display: flex; animation: rise 0.3s ease; }
    .lightbox img { max-width: 100%; max-height: 74vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .lightbox p { font-family: 'Playfair Display', serif; font-style: italic; color: var(--pink-soft); margin-top: 16px; text-align: center; max-width: 420px; line-height: 1.5; }
    .lightbox .close { position: absolute; top: 14px; right: 16px; background: none; border: 0; font-size: 28px; color: var(--ink); }

    /* ── Sudoku ─────────────────────────── */
    .sudoku { display: grid; grid-template-columns: repeat(9, 1fr); width: min(100%, 380px); margin: 8px auto 0; border: 2px solid var(--pink); border-radius: 10px; overflow: hidden; }
    .sudoku button {
      aspect-ratio: 1; border: 0; border-right: 1px solid rgba(240,160,190,0.18); border-bottom: 1px solid rgba(240,160,190,0.18);
      background: rgba(18,6,8,0.6); font-size: clamp(15px, 4.6vw, 20px); color: var(--pink-soft); padding: 0; transition: background 0.2s;
    }
    .sudoku button.given { color: var(--ink); font-weight: 600; }
    .sudoku button.c2, .sudoku button.c5 { border-right: 2px solid var(--pink); }
    .sudoku button.r2, .sudoku button.r5 { border-bottom: 2px solid var(--pink); }
    .sudoku button.peer { background: rgba(139,58,82,0.22); }
    .sudoku button.same { background: rgba(194,82,122,0.35); }
    .sudoku button.sel { background: rgba(240,160,190,0.45); color: #fff; }
    .sudoku button.bad { color: #ff6b6b; }
    .sudoku button.boxdone { animation: glow 1.2s ease; }
    @keyframes glow { 40% { background: rgba(255,207,90,0.35); } }
    .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(100%, 380px); margin: 14px auto 0; }
    .numpad button { padding: 11px 0; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(240,160,190,0.08); font-size: 17px; }
    .numpad button:active { background: rgba(240,160,190,0.25); }
    .sudoku-notes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
    .sudoku-notes span { font-size: 11px; padding: 5px 10px; border-radius: 99px; background: rgba(240,160,190,0.1); border: 1px solid rgba(240,160,190,0.25); color: var(--pink-soft); }

    /* ── Image puzzle ───────────────────── */
    .puzzle { display: grid; grid-template-columns: repeat(3, 1fr); width: min(100%, 330px); aspect-ratio: 1; margin: 8px auto 0; border-radius: 12px; overflow: hidden; background: #000; }
    .tile { border: 0; padding: 0; background-repeat: no-repeat; transition: transform 0.2s, box-shadow 0.3s; box-shadow: inset 0 0 0 1.5px rgba(18,6,8,0.85); }
    .tile.sel { box-shadow: inset 0 0 0 3px var(--pink); transform: scale(0.94); }
    .puzzle.solved .tile { box-shadow: none; }
    .puzzle-meta { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

    /* ── 3D ring ────────────────────────── */
    .ring-stage { height: 330px; perspective: 1000px; display: flex; align-items: center; justify-content: center; touch-action: pan-y; cursor: grab; user-select: none; margin: 0 -16px; overflow: hidden; }
    .ring { position: relative; width: 130px; height: 180px; transform-style: preserve-3d; }
    .ring figure {
      position: absolute; inset: 0; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,245,240,0.85);
      box-shadow: 0 0 24px rgba(240,160,190,0.35); background: #000;
    }
    .ring img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .ring-floor { width: 260px; height: 40px; margin: -20px auto 0; border-radius: 50%; background: radial-gradient(ellipse, rgba(240,160,190,0.25), transparent 70%); }

    /* ── Love bomb ──────────────────────── */
    .bomb-btn { font-size: 54px; background: none; border: 0; filter: drop-shadow(0 0 20px rgba(240,160,190,0.4)); transition: transform 0.15s; }
    .bomb-btn:active { transform: scale(0.85) rotate(-10deg); }
    .bomb-line { font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; color: var(--pink-soft); min-height: 64px; margin-top: 14px; line-height: 1.5; }
    .bomb-count { font-size: 11px; letter-spacing: 2px; color: var(--faint); text-transform: uppercase; margin-top: 8px; }

    /* ── Floating hearts ────────────────── */
    .float-heart { position: fixed; z-index: 70; pointer-events: none; font-size: 22px; animation: floatUp 2.2s ease-out forwards; }
    .float-text { position: fixed; z-index: 70; pointer-events: none; font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px; color: var(--pink-soft); white-space: nowrap; animation: floatUp 2.6s ease-out forwards; text-shadow: 0 2px 10px rgba(0,0,0,0.6); transform: translateX(-50%); }
    @keyframes floatUp { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 -120px; } }

    /* ── Intro overlay (balloons) ───────── */
    .intro { position: fixed; inset: 0; z-index: 75; background: radial-gradient(ellipse at 50% 40%, #2a0b14, #0b0305 75%); display: none; overflow: hidden; }
    .intro.show { display: block; }
    .intro.hide { opacity: 0; transition: opacity 0.8s; pointer-events: none; }
    .intro-text { position: absolute; left: 0; right: 0; top: 16%; text-align: center; padding: 0 20px; z-index: 3; pointer-events: none; text-shadow: 0 2px 18px rgba(11,3,5,0.9); }
    #balloons { position: absolute; inset: 0; z-index: 1; }
    .intro-text h2 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(30px, 8vw, 52px); line-height: 1.15; }
    .intro-text h2 em { color: var(--pink); }
    .intro-text p { font-size: 13px; color: var(--muted); margin-top: 12px; letter-spacing: 1px; }
    .intro-actions { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; z-index: 3; }
    .skip { background: none; border: 0; color: var(--faint); font-size: 12px; text-decoration: underline; margin-top: 12px; display: block; margin-left: auto; margin-right: auto; }
    .balloon {
      position: absolute; bottom: -160px; width: 64px; height: 80px; border: 0; padding: 0; background: none;
      animation: balloonUp var(--dur) linear var(--delay) infinite;
    }
    .balloon::before {
      content: ''; position: absolute; inset: 0; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
      background:
        radial-gradient(circle at 32% 26%, rgba(255,255,255,0.75), rgba(255,255,255,0) 16%),
        radial-gradient(circle at 40% 35%, var(--c) 45%, color-mix(in srgb, var(--c) 65%, #000) 100%);
      box-shadow: inset -6px -8px 14px rgba(0,0,0,0.18);
    }
    .balloon::after { content: ''; position: absolute; left: 50%; top: 79px; width: 1px; height: 60px; background: rgba(255,255,255,0.35); }
    .balloon.popped { animation-play-state: paused; }
    .balloon.popped::before { transform: scale(1.5); opacity: 0; transition: all 0.18s ease-out; }
    .balloon.popped::after { opacity: 0; }
    @keyframes balloonUp {
      0%   { transform: translate(0, 0) rotate(-4deg); }
      50%  { transform: translate(14px, -60vh) rotate(4deg); }
      100% { transform: translate(-8px, -125vh) rotate(-4deg); }
    }

    .fab { position: fixed; right: 16px; bottom: 18px; z-index: 60; width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(240,160,190,0.4); background: rgba(42,11,20,0.85); font-size: 24px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
    .toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 20px); z-index: 92; opacity: 0; pointer-events: none; transition: all 0.4s; background: rgba(42,11,20,0.95); border: 1px solid rgba(240,160,190,0.4); color: var(--pink-soft); padding: 11px 18px; border-radius: 14px; font-size: 13px; max-width: calc(100% - 32px); text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .secret {
      margin-top: 28px; padding: 26px 18px; border-radius: 18px; text-align: center;
      background: linear-gradient(135deg, rgba(180,60,90,0.18), rgba(212,100,140,0.08));
      border: 1px dashed rgba(240,160,190,0.45);
    }
    .secret-emoji { font-size: 44px; animation: peek 2.4s ease-in-out infinite; display: inline-block; }
    @keyframes peek { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-10deg); } 90% { transform: rotate(10deg); } }

function istTime(y, mo, d, h = 0, mi = 0) {
  return new Date(Date.UTC(y, mo - 1, d, h - 5, mi - 30, 0));
}
const simOffset = AT ? (new Date(AT + '+05:30').getTime() - Date.now()) || 0 : 0;
const now = () => Date.now() + simOffset;

const BDAY_START = istTime(BDAY.year, BDAY.month, BDAY.day).getTime();
// Night lock: nothing opens before this (IST). Midnight items unlock here too.
const OPEN_AT = istTime(BDAY.year, BDAY.month, BDAY.day, 8, 0).getTime();
const isBirthday = () => PREVIEW || now() >= OPEN_AT;
const nightLock = () => !PREVIEW && now() >= BDAY_START && now() < OPEN_AT;

  s.idx = i;

const isOpen = s => PREVIEW || now() >= s.unlock;

function fmtClock(t) {
  const [h, m] = t.split(':').map(Number);
  const hr = h % 12 || 12, ap = h < 12 ? 'AM' : 'PM';
  return { big: m ? `${hr}:${String(m).padStart(2, '0')}` : `${hr}`, ap };
}
function fmtLeft(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m`;
  return `${s}s`;
}
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const FX = (function () {
  const c = $('#fx'), ctx = c.getContext('2d');
  const night = $('#night');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, rockets = [], parts = [], running = false, nightOn = false, nightTimer;
  const NIGHT_COLORS = ['#ff8fb8', '#ffd27a', '#ffffff', '#d9b3ff', '#ffb38a', '#ff5c93', '#9fe8ff'];
  const DAY_COLORS = PARTY ? ['#ff4f8b', '#ff9a3d', '#f5b800', '#b56cff', '#f06292', '#3fc48c'] : NIGHT_COLORS;
  const colors = () => (nightOn || !PARTY ? NIGHT_COLORS : DAY_COLORS);
  const TYPES = ['peony', 'peony', 'ring', 'heart', 'crossette', 'willow', 'glitter'];
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const scale = reduce ? 0.4 : 1;
  function spark(x, y, vx, vy, color, o = {}) {
    parts.push(Object.assign({ x, y, vx, vy, color, life: rand(60, 95), max: 95, size: rand(1.4, 2.8), g: 0.045, drag: 0.982, kind: 'spark' }, o));
  }
  function burst(x, y, color, n = 80, type = 'peony') {
    n = Math.round(n * scale);
    const second = pick(colors());
    if (type === 'ring') {
      for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; spark(x, y, Math.cos(a) * 4.2, Math.sin(a) * 4.2, color); }
      for (let i = 0; i < n / 2; i++) { const a = i / (n / 2) * Math.PI * 2; spark(x, y, Math.cos(a) * 2.2, Math.sin(a) * 2.2, second); }
    } else if (type === 'heart') {
      for (let i = 0; i < n; i++) {
        const t = i / n * Math.PI * 2, k = 0.27;
        const hx = 16 * Math.sin(t) ** 3, hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        spark(x, y, hx * k, hy * k, color, { g: 0.02, life: rand(80, 100), max: 100 });
      }
    } else if (type === 'crossette') {
      for (let i = 0; i < 18 * scale; i++) { const a = rand(0, Math.PI * 2), sp = rand(3, 5); spark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, color, { split: true, life: 46, max: 46, size: 2.6 }); }
    } else if (type === 'willow') {
      for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), sp = rand(0.5, 3.6); spark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, '#ffd27a', { g: 0.025, drag: 0.975, life: rand(120, 170), max: 170, size: rand(1.2, 2.2), trail: true }); }
    } else if (type === 'glitter') {
      for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), sp = rand(1, 5.5); spark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, Math.random() < 0.5 ? '#ffffff' : color, { twinkle: true, life: rand(70, 120), max: 120 }); }
    } else {
      for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), sp = rand(1, 6); spark(x, y, Math.cos(a) * sp, Math.sin(a) * sp, Math.random() < 0.25 ? second : color); }
    }
    start();
  }
  function skyShot(x, type) {
    x = x ?? rand(W * 0.12, W * 0.88);
    // Pick the burst height (15% to 55% from the top), then launch just fast enough to reach it.
    const rise = H * rand(0.5, 0.85);
    rockets.push({ x, y: H + 10, vx: rand(-1, 1), vy: -Math.sqrt(2 * 0.15 * rise), color: pick(colors()), type: type || pick(TYPES) });
    start();
  }
  function confetti(n = 140) {
    n = Math.round(n * scale);
    const cols = ['#ff8fb8', '#f06292', '#ffd27a', '#ffffff', '#d9b3ff', '#9fe8ff', '#ffb38a'];
    for (let i = 0; i < n; i++) {
      parts.push({ x: rand(0, W), y: rand(-H * 0.4, -10), vx: rand(-1.2, 1.2), vy: rand(1.5, 3.5), life: rand(170, 260), max: 260, color: pick(cols), size: rand(6, 10), rot: rand(0, 6), vr: rand(-0.2, 0.2), g: 0.02, drag: 1, kind: Math.random() < 0.25 ? 'heart' : 'conf' });
    }
    start();
  }
  function sparkle(x, y) {
    for (let i = 0; i < 2; i++) parts.push({ x: x + rand(-4, 4), y: y + rand(-4, 4), vx: rand(-0.6, 0.6), vy: rand(-1, 0.2), life: 34, max: 34, color: pick(['#f06292', '#ffb6ce', '#ffd27a', '#b56cff']), size: rand(1.4, 2.6), g: 0.03, drag: 0.97, kind: 'spark', twinkle: true });
    start();
  }
  function celebrate(n = 8, span = 2600) {
    for (let i = 0; i < n; i++) setTimeout(() => skyShot(), i * span / n + rand(0, 200));
  }
  function setNight(on) {
    nightOn = on;
    night.classList.toggle('on', on);
  }
  // A full sky show: dims the page to a night sky, fires a big mixed salvo, then a finale volley.
  function grand(ms = 6000, opts = {}) {
    if (opts.night !== false) { setNight(true); clearTimeout(nightTimer); nightTimer = setTimeout(() => setNight(false), ms + 2200); }
    const n = Math.round(ms / 380);
    for (let i = 0; i < n; i++) setTimeout(() => skyShot(), i * (ms * 0.7) / n + rand(0, 250));
    setTimeout(() => {
      for (let i = 0; i < 6; i++) setTimeout(() => skyShot(W * (0.12 + i * 0.15), i === 2 || i === 3 ? 'heart' : pick(TYPES)), i * 90);

  }
  function start() { if (!running) { running = true; requestAnimationFrame(loop); } }
  function loop() {
    ctx.clearRect(0, 0, W, H);
    const glow = nightOn || !PARTY;
    ctx.globalCompositeOperation = glow ? 'lighter' : 'source-over';
    rockets = rockets.filter(r => {
      const px = r.x, py = r.y;
      r.x += r.vx; r.y += r.vy; r.vy += 0.15;
      ctx.strokeStyle = r.color; ctx.lineWidth = 2.4; ctx.globalAlpha = 0.95;
      ctx.beginPath(); ctx.moveTo(px - r.vx * 3, py - r.vy * 3); ctx.lineTo(r.x, r.y); ctx.stroke();
      if (Math.random() < 0.8) parts.push({ x: r.x, y: r.y + 4, vx: rand(-0.4, 0.4), vy: rand(0.5, 1.6), life: 22, max: 22, color: '#ffd27a', size: 1.3, g: 0, drag: 1, kind: 'spark' });
      if (r.vy >= -1.2) { burst(r.x, r.y, r.color, r.type === 'heart' ? 90 : 85, r.type); return false; }
      return true;
    });
    const born = [];
    parts = parts.filter(p => {
      if (p.trail && p.life % 3 === 0) born.push({ x: p.x, y: p.y, vx: 0, vy: 0.3, life: 26, max: 26, color: p.color, size: p.size * 0.7, g: 0.01, drag: 1, kind: 'spark' });
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
      if (p.drag) { p.vx *= p.drag; p.vy *= p.drag; }
      if (p.split && p.life === 1) {
        for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; born.push({ x: p.x, y: p.y, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2, life: 40, max: 40, color: pick(colors()), size: 1.8, g: 0.03, drag: 0.97, kind: 'spark' }); }
      }
      let a = Math.max(0, p.life / p.max);

        if (glow) { ctx.globalAlpha = a * 0.25; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 2.6, 0, Math.PI * 2); ctx.fill(); }
        ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();

        ctx.globalCompositeOperation = 'source-over';
        p.rot += p.vr; p.x += Math.sin(p.life / 12) * 0.6;
        ctx.globalAlpha = Math.min(1, a * 2); ctx.fillStyle = p.color;

        ctx.restore();
        ctx.globalCompositeOperation = op;
      }

    function bgFor(piece) {
      const W = board.clientWidth || 300, t = W / 3;
      const h = W * PUZZLE_PHOTO.h / PUZZLE_PHOTO.w;
      const y0 = Math.max(0, Math.min(h - W, h * PUZZLE_PHOTO.focusY - W / 2));
      return `url(${PUZZLE_PHOTO.src}) ${-(piece % 3) * t}px ${-(Math.floor(piece / 3) * t + y0)}px / ${W}px ${h}px no-repeat`;
    }
    function draw() {
      board.innerHTML = '';
      perm.forEach((piece, i) => {
        const b = document.createElement('button');
        b.className = 'tile' + (i === sel ? ' sel' : '');
        b.style.background = bgFor(piece);
        b.addEventListener('click', () => tap(i));
        board.appendChild(b);
      });
      $('#pzMoves', body).textContent = moves;
    }
    function tap(i) {
      if (solved) return;
      if (sel < 0) { sel = i; draw(); return; }
      if (sel !== i) { [perm[sel], perm[i]] = [perm[i], perm[sel]]; moves++; }
      sel = -1; draw();
      if (perm.every((v, k) => v === k)) {
        solved = true; board.classList.add('solved');
        FX.confetti(); FX.grand(4500);
        body.querySelector('.puzzle-meta').innerHTML = `Solved in ${moves} moves 🎉<br><span style="font-family:Playfair Display,serif;font-style:italic;font-size:16px;color:var(--pink-soft)">Tukde kitne bhi ho, hum hamesha jud jaate hain.</span>`;
      }
    }
    $('#pzShuffle', body).addEventListener('click', shuffle);
    $('#pzPeek', body).addEventListener('click', () => openLightbox({ src: PUZZLE_PHOTO.src, cap: 'Cheating allowed, aaj aapka birthday hai 😌' }));
    addEventListener('resize', () => perm && draw());
    shuffle();
  },

  ring(body) {
    const list = PHOTOS.filter(p => !p.video).slice(0, 8);
    body.innerHTML = `
      <p class="note serif" style="margin-top:0">Hum, har angle se. Swipe karke ghumao.</p>
      <div class="ring-stage"><div class="ring">${list.map(p => `<figure><img src="${p.src}" alt="" /></figure>`).join('')}</div></div>
      <div class="ring-floor"></div>`;
    const stage = $('.ring-stage', body), ring = $('.ring', body), figs = [...ring.children];
    const n = figs.length, step = 360 / n;
    const radius = Math.round(130 / 2 / Math.tan(Math.PI / n)) + 30;
    figs.forEach((f, i) => { f.style.transform = `rotateY(${i * step}deg) translateZ(${radius}px)`; });
    let angle = 0, vel = 0.25, tilt = -8, dragging = false, lastX = 0, moved = 0;
    (function spin() {
      if (!dragging) { angle += vel; vel += (0.25 - vel) * 0.02; }
      ring.style.transform = `translateZ(-${radius}px) rotateX(${tilt}deg) rotateY(${angle}deg)`;
      if (document.body.contains(ring)) requestAnimationFrame(spin);
    })();
    stage.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; moved = 0; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
      angle += dx * 0.4; vel = dx * 0.4;
    });
    stage.addEventListener('pointerup', e => {
      dragging = false;
      if (moved < 6) {
        const hit = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.tagName === 'FIGURE' && ring.contains(x));
        if (hit) openLightbox(list[figs.indexOf(hit)]);
      }
    });
  },

        <p class="bomb-line"></p>
        <p class="bomb-count">0 / ${LOVE_LINES.length} baatein</p>
      </div>`;
    $('.bomb-btn', body).addEventListener('click', e => {
      let i; do { i = Math.floor(Math.random() * LOVE_LINES.length); } while (seen.size < LOVE_LINES.length && seen.has(i));
      seen.add(i);
      $('.bomb-line', body).textContent = LOVE_LINES[i];
      $('.bomb-count', body).textContent = `${seen.size} / ${LOVE_LINES.length} baatein` + (seen.size === LOVE_LINES.length ? ' · sab padh li! 💗' : '');
      const r = e.currentTarget.getBoundingClientRect();
      FX.burst(r.left + r.width / 2, r.top + r.height / 2, pick(['#f0a0be', '#ff7aa8', '#ffcf5a']), 50);
      for (let k = 0; k < 6; k++) setTimeout(() => floatHeart(r.left + rand(0, r.width), r.top + rand(0, r.height), k === 0), k * 80);

  text(body, s) {
    body.innerHTML = `
      <div class="chat">
        <div class="chat-head">💌 Aapke liye ek message aaya hai</div>
        <div class="bubble">${s.message.split('\n').map(l => `<p>${l}</p>`).join('')}<span class="bubble-time">${s.sent || ''}</span></div>
      </div>

  book(body, s) {
    const part = BOOK[s.part];
    const parts = SCHEDULE.filter(x => x.type === 'book');
    const next = parts.find(x => x.part === s.part + 1);
    body.innerHTML = `<div class="book-page"><p class="book-loading">Kitaab khul rahi hai... 📖</p></div>`;
    const page = $('.book-page', body);
    if (!part.ready && !PREVIEW) return;
    fetch(part.file).then(r => (r.ok ? r.text() : Promise.reject())).then(txt => {
      const lines = txt.replace(/\r/g, '').trim().split('\n');
      let title = '';
      if (lines[0] && lines[0].startsWith('# ')) title = lines.shift().slice(2);
      const paras = lines.join('\n').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
      page.innerHTML = `
        <p class="book-kicker">Part ${s.part + 1} / ${parts.length}</p>
        ${title ? `<h3 class="book-title">${title}</h3>` : ''}
        <div class="book-text">${paras.map(x => `<p>${x.replace(/\n/g, '<br>')}</p>`).join('')}</div>
        <div class="row"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP.number}?text=${encodeURIComponent(`Pingu, mujhe kahani ka part ${s.part + 1} chahiye 📖`)}">WhatsApp karo 📖</a></div>
        <p class="book-next">${next ? `Agla part ${fmtClock(next.time).big} ${fmtClock(next.time).ap} pe khulega 🤫` : 'The end... abhi ke liye. Kahani toh chalti rahegi 🤍'}</p>`;
    }).catch(() => { page.innerHTML = '<p class="book-loading">Ye part abhi likha ja raha hai ✍️</p>'; });
  },

  gift(body, s) {
    body.innerHTML = `
      <div class="center">
        <button class="giftbox" aria-label="Open gift"><span class="lid">🎀</span><span class="box">🎁</span></button>
        <p class="note">Tap karke kholo</p>
      </div>`;
    const box = $('.giftbox', body);
    box.addEventListener('click', () => {
      if (box.classList.contains('opened')) return;
      box.classList.add('opened');
      const r = box.getBoundingClientRect();
      FX.burst(r.left + r.width / 2, r.top + r.height / 2, '#f06292', 70, 'heart');
      FX.confetti(90);
      $('.note', body).outerHTML = `<p class="note serif">${s.note}</p>`;
    });
  },

  dinner(body) {
    const picks = {};
    body.innerHTML = `
      <p class="note serif" style="margin-top:0">Aaj raat 8 baje, aapki aur meri dinner date 🕯️</p>
      <div class="menu-card">
        <p class="menu-title">Aaj ka menu</p>
        <p class="menu-sub">Har section se ek chuno. Baaki Pingu sambhal lega.</p>
        ${Object.entries(DINNER.menu).map(([sec, items]) => `
          <p class="menu-sec">${sec}</p>
          <div class="chips" data-sec="${sec}">${items.map(it => `<button class="chip">${it}</button>`).join('')}</div>`).join('')}
        <p class="menu-sec">Dress code</p>
        <p class="menu-dress">${DINNER.dress}</p>
      </div>
      <div class="row">
        <a class="btn" id="sendOrder" target="_blank" rel="noopener">Order bhejo 💌</a>
        <button class="btn ghost" id="mood">🕯️ Mood set karo</button>
      </div>
      <div class="row"><a class="btn ghost" id="callMe" target="_blank" rel="noopener">📞 Pingu ko bulao</a></div>`;
    body.querySelectorAll('.chips').forEach(g => g.addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      g.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
      picks[g.dataset.sec] = c.textContent;
      floatHeart(e.clientX, e.clientY, false);
      update();
    }));
    const wa = text => `https://wa.me/${WHATSAPP.number}?text=${encodeURIComponent(text)}`;
    function update() {
      const order = Object.keys(DINNER.menu).map(k => `${k}: ${picks[k] || 'aap hi decide karo'}`).join('\n');
      $('#sendOrder', body).href = wa(`Pingu, mera dinner order 🍽️\n${order}`);
    }
    update();
    $('#callMe', body).href = wa('Dinner date pe aa jao Pingu, main ready hu 🕯️');
    let moodOn = false;
    $('#mood', body).addEventListener('click', e => {
      moodOn = !moodOn;
      FX.setNight(moodOn);
      e.currentTarget.textContent = moodOn ? '💡 Lights on' : '🕯️ Mood set karo';
      if (moodOn) toast('Lights dim, candles on. Ab date shuru 🕯️');

  secret(body) {
    body.innerHTML = `
      <div class="center">
        <div class="secret-emoji">🙈</div>
        <p class="secret-title">Ek secret surprise bhi hai</p>
        <p class="secret-sub">Ye wala website pe nahi milega. Mujhe WhatsApp karo, phir dekhte hain 😌</p>
        <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP.number}?text=${encodeURIComponent(WHATSAPP.text)}">WhatsApp karo 🙈</a>
      </div>`;
  },

  finale(body) {
    body.innerHTML = `
      <p class="note serif" style="margin-top:0;font-size:19px">Aaj ka din yahin khatam nahi hota, bas date badalti hai.</p>
      <p class="note">Apka ye saal hasi, sukoon, aur bahut saari jeeti hui sudoku wala ho. Jo bhi maango, wo mile, aur jo na maango, wo bhi. Aur haan, agle birthday pe ye sab main apke saamne baith ke karunga.</p>
      <p class="note serif">Happy Birthday, meri pyari Tingu ji.<br>Hamesha apka, Pingu 🐧</p>
      <div class="row"><button class="btn" id="moreFw">🎆 Aur sky shots</button></div>`;
    $('#moreFw', body).addEventListener('click', () => FX.grand(7000));
  },
};

// ─── Song timing tool (for Pingu) ────────────────────────────────
function buildTimingTool(body, audio) {
  const box = document.createElement('div');
  box.className = 'timing-tool';
  box.innerHTML = `
    <b>Lyrics timing tool</b> (sirf aapko dikhta hai with ?timing=1)<br>
    1. Mp3 chuno (agar SONG.src abhi khaali hai) <input type="file" accept="audio/*" /><br>
    2. Lyrics paste karo, ek line per row.
    <textarea id="lyIn" placeholder="Pehli line&#10;Doosri line"></textarea>
    3. Start dabao. Jab bhi nayi line shuru ho, "Tap" dabao (ya spacebar).
    <div class="current" id="lyCur"></div>
    <div class="row" style="justify-content:flex-start"><button class="btn" id="lyStart">Start</button><button class="btn" id="lyTap">Tap</button><button class="btn ghost" id="lyUndo">Undo</button></div>
    4. Ye copy karke SONG.lyrics mein paste karo:
    <textarea id="lyOut" readonly></textarea>`;
  body.appendChild(box);
  let lines = [], stamps = [], k = 0;
  $('input[type=file]', box).addEventListener('change', e => { const f = e.target.files[0]; if (f) audio.src = URL.createObjectURL(f); });
  const show = () => {
    $('#lyCur', box).textContent = k < lines.length ? `Agli line: ${lines[k]}` : 'Sab lines ho gayi ✅';
    $('#lyOut', box).value = 'lyrics: [\n' + stamps.map(s => `  { t: ${s.t.toFixed(2)}, l: ${JSON.stringify(s.l)} },`).join('\n') + '\n],';
  };
  $('#lyStart', box).addEventListener('click', () => {
    lines = $('#lyIn', box).value.split('\n').map(x => x.trim()).filter(Boolean);
    stamps = []; k = 0; audio.currentTime = 0; audio.play(); show();
  });
  const tap = () => { if (k < lines.length) { stamps.push({ t: audio.currentTime, l: lines[k++] }); show(); } };
  $('#lyTap', box).addEventListener('click', tap);
  $('#lyUndo', box).addEventListener('click', () => { if (k) { k--; stamps.pop(); show(); } });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); tap(); } });
}

// ─── Lightbox ────────────────────────────────────────────────────
function openLightbox(p) {
  const lb = $('#lightbox');
  const v = $('video', lb);
  lb.classList.toggle('is-video', !!p.video);
  if (p.video) { v.src = p.video; v.play().catch(() => {}); } else { v.pause(); $('img', lb).src = p.src; }
  $('p', lb).textContent = p.cap || '';
  lb.classList.add('show');
}
$('#lightbox').addEventListener('click', e => { if (e.target.tagName !== 'IMG' && e.target.tagName !== 'VIDEO') { $('#lightbox').classList.remove('show'); $('#lightbox video').pause(); } });

// ─── Balloon intro ───────────────────────────────────────────────
function runIntro() {
  const intro = $('#intro'), wrap = $('#balloons');
  const NEED = 7;
  let popped = 0;
  intro.classList.add('show');
  const colors = PARTY
    ? ['#ff6fa3', '#ffa25c', '#ffd04d', '#5fd3a0', '#5cb8ff', '#a77bff', '#fff0f5', '#ff8fd0']
    : ['#f0a0be', '#c2527a', '#ffcf5a', '#ff7aa8', '#e8a0ff', '#fff0f5', '#d4956a'];
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('button');
    b.className = 'balloon';
    b.setAttribute('aria-label', 'Balloon');
    b.style.cssText = `left:${rand(2, 84)}%;--c:${pick(colors)};--dur:${rand(7, 12)}s;--delay:${-rand(0, 10)}s;transform-origin:center`;
    b.addEventListener('pointerdown', e => {
      if (b.classList.contains('popped')) return;
      b.classList.add('popped');
      FX.burst(e.clientX, e.clientY, getComputedStyle(b).getPropertyValue('--c').trim() || '#f0a0be', 28);
      popped++;
      if (popped > NEED) return;
      $('#popCount').textContent = popped < NEED ? `${NEED - popped} aur...` : 'Bas! 🎉';
      setTimeout(() => { b.classList.remove('popped'); b.style.left = rand(2, 84) + '%'; }, 1200);
      if (popped === NEED) finish();
    });
    wrap.appendChild(b);
  }
  function finish() {
    $('#skipIntro').remove();
    setTimeout(() => {
      $('#introText').innerHTML = '<h2>Happy Birthday,<br><em>Tingu ji</em> 🎂</h2><p>31 October · aapka din shuru</p>';
      FX.grand(4500, { night: false });
      setTimeout(() => FX.confetti(), 800);
      setTimeout(() => {
        $('#introActions').innerHTML = '<button class="btn" id="enter">Chalo, aapka din dekhte hain →</button>';
        $('#enter').addEventListener('click', close);
      }, 2600);
    }, 400);
  }
  function close() {
    store.set('introSeenAM', true);
    intro.classList.add('hide');
    setTimeout(() => { intro.classList.remove('show', 'hide'); wrap.innerHTML = ''; openNewest(); }, 800);
  }
  $('#skipIntro').addEventListener('click', finish);
}

function openNewest() {
  const t = newestGroupTime();
  if (t == null) return;
  const s = SCHEDULE.find(x => visible(x) && x.unlock === t);
  toggleSlot(s, true);
  setTimeout(() => $('#slot-' + s.idx).scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
}

// ─── Boot ────────────────────────────────────────────────────────
let mode;
function boot() {
  mode = isBirthday();
  renderHero();
  renderSchedule();
  updateBigCountdown();
  $('#fab').hidden = !mode;
  placeStickers();
  setupTeddy();
  if (mode) {
    SCHEDULE.forEach(s => { if (isOpen(s)) wasOpen.add(s.idx); });
    if (!store.get('introSeenAM') || params.has('intro')) runIntro();
    else if (!PREVIEW) openNewest();
  }
}
if (PREVIEW || AT) {
  const pill = $('#previewPill');
  pill.hidden = false;
  pill.textContent = PREVIEW ? 'preview mode · sab khula hai' : `test time: ${AT} IST`;
}
$('#fab').addEventListener('click', () => FX.grand(3200));
boot();
setInterval(() => {
  if (isBirthday() !== mode) { boot(); return; }
  updateBigCountdown();
  updateStatuses(false);
}, 1000);
</script>
