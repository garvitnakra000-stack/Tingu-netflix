<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 June — Aapke Sapne Mein</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #faf7f2;
    --plum: #8b5e6e;
    --deep: #1a0e14;
    --rose: #c9899a;
    --gold: #c9a84c;
    --mist: #e8ddd5;
  }

  html, body {
    height: 100%;
    background: var(--deep);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* ── STARS ── */
  #stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--d) ease-in-out infinite alternate;
    opacity: 0;
  }
  @keyframes twinkle {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: var(--op); transform: scale(1.2); }
  }

  /* ── SCREENS ── */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
    padding: 2rem;
  }
  .screen.active {
    opacity: 1;
    pointer-events: all;
  }
  .screen.exit {
    opacity: 0;
    pointer-events: none;
  }

  /* ── SCREEN 0: SLEEPING ── */
  #s0 {
    background: transparent;
    text-align: center;
    cursor: pointer;
  }
  .sleeping-img-wrap {
    position: relative;
    width: min(320px, 80vw);
    margin: 0 auto 2rem;
  }
  .sleeping-img-wrap img {
    width: 100%;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    filter: brightness(0.75) saturate(0.8);
    box-shadow: 0 0 60px rgba(201, 137, 154, 0.3), 0 0 120px rgba(139, 94, 110, 0.15);
  }
  .glow-ring {
    position: absolute;
    inset: -12px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at center, rgba(201,137,154,0.12) 0%, transparent 70%);
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
  }

  .date-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: var(--rose);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    opacity: 0.7;
  }
  .sleeping-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    font-weight: 300;
    font-style: italic;
    color: var(--cream);
    line-height: 1.3;
    margin-bottom: 0.5rem;
  }
  .sleeping-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    color: var(--rose);
    opacity: 0.6;
    letter-spacing: 0.05em;
  }
  .zzz {
    display: inline-block;
    font-size: 1rem;
    color: var(--rose);
    opacity: 0.5;
    animation: float-zzz 2.5s ease-in-out infinite;
  }
  .zzz:nth-child(2) { animation-delay: 0.5s; font-size: 0.75rem; }
  .zzz:nth-child(3) { animation-delay: 1s; font-size: 0.55rem; }
  @keyframes float-zzz {
    0% { transform: translateY(0) translateX(0); opacity: 0.2; }
    50% { opacity: 0.6; }
    100% { transform: translateY(-28px) translateX(8px); opacity: 0; }
  }
  .tap-hint {
    margin-top: 2.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--rose);
    opacity: 0;
    text-transform: uppercase;
    animation: fade-hint 2s ease 2.5s forwards;
  }
  @keyframes fade-hint {
    to { opacity: 0.45; }
  }

  /* ── DREAM OVERLAY ── */
  #dream-overlay {
    position: fixed;
    inset: 0;
    background: white;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #dream-overlay.flash {
    opacity: 1;
  }

  /* ── SCREEN 1: VIDEO DREAM ── */
  #s1 {
    background: var(--deep);
    padding: 0;
    overflow: hidden;
  }
  #s1 video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.85) brightness(0.9);
  }
  .video-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(26,14,20,0.7) 100%);
    pointer-events: none;
  }
  .dream-label {
    position: absolute;
    top: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 3.5vw, 1.3rem);
    font-style: italic;
    font-weight: 300;
    color: rgba(250,247,242,0.75);
    letter-spacing: 0.08em;
    text-align: center;
    white-space: nowrap;
  }
  .video-tap-hint {
    position: absolute;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: rgba(201,137,154,0.5);
    text-transform: uppercase;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }

  /* ── SCREEN 2: LETTER ── */
  #s2 {
    background: var(--deep);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.5s ease;
    align-items: center;
    justify-content: flex-start;
    padding: 3rem 1.5rem 4rem;
  }
  #s2.active {
    pointer-events: all;
    opacity: 1;
  }

  .letter-header {
    text-align: center;
    margin-bottom: 2.5rem;
    width: 100%;
  }
  .letter-eyebrow {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: var(--rose);
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 0.5rem;
  }
  .letter-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-style: italic;
    font-weight: 300;
    color: var(--cream);
    line-height: 1.2;
  }

  .letter-wrap {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
  }
  .letter-img {
    width: 100%;
    border-radius: 4px;
    box-shadow:
      0 2px 8px rgba(0,0,0,0.4),
      0 0 40px rgba(201,137,154,0.12),
      0 0 0 1px rgba(201,168,76,0.15);
    opacity: 0;
    transform: translateY(24px) rotate(-1deg);
    transition: opacity 1.2s ease 0.3s, transform 1.2s ease 0.3s;
    filter: sepia(0.15) brightness(0.95);
  }
  #s2.active .letter-img {
    opacity: 1;
    transform: translateY(0) rotate(-0.5deg);
  }

  .letter-footer {
    text-align: center;
    margin-top: 2.5rem;
    opacity: 0;
    transition: opacity 1s ease 1.5s;
  }
  #s2.active .letter-footer {
    opacity: 1;
  }
  .letter-footer-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--rose);
    opacity: 0.7;
    line-height: 1.8;
  }
  .heart-final {
    font-size: 1.2rem;
    display: block;
    margin-top: 0.5rem;
    animation: heartbeat 2s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* ── PARTICLES ── */
  .particle {
    position: fixed;
    font-size: 0.6rem;
    pointer-events: none;
    z-index: 5;
    animation: drift var(--pd) ease-in-out infinite;
    opacity: 0;
  }
  @keyframes drift {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.4; }
    90% { opacity: 0.2; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* ── AUDIO ── */
  #audio-btn {
    position: fixed;
    bottom: 1.2rem;
    right: 1.2rem;
    z-index: 100;
    background: rgba(139,94,110,0.3);
    border: 1px solid rgba(201,137,154,0.3);
    color: var(--rose);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    transition: background 0.3s;
    opacity: 0;
  }
  #audio-btn.visible { opacity: 1; }
  #audio-btn:hover { background: rgba(139,94,110,0.5); }

  /* scrollbar hide */
  #s2::-webkit-scrollbar { display: none; }
  #s2 { scrollbar-width: none; }
</style>
</head>
<body>

<!-- Stars -->
<div id="stars"></div>

<!-- Particles -->
<div id="particles"></div>

<!-- Flash overlay -->
<div id="dream-overlay"></div>

<!-- Audio -->
<audio id="bgm" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
<!-- Replace above src with your chosen song -->

<button id="audio-btn" title="Toggle music">♪</button>

<!-- SCREEN 0: SLEEPING -->
<div class="screen active" id="s0">
  <div class="date-label">15 June, 2025</div>

  <div class="sleeping-img-wrap">
    <div class="glow-ring"></div>
    <img src="/day/june/15/dream1.png" alt="Tingu sleeping" />
  </div>

  <div style="text-align:center; margin-bottom:1rem;">
    <span class="zzz">z</span>
    <span class="zzz">z</span>
    <span class="zzz">z</span>
  </div>

  <div class="sleeping-title">Aapke Sapne Mein</div>
  <div class="sleeping-sub">aap so rahi thi, par main wahan tha</div>

  <div class="tap-hint">tap to enter the dream</div>
</div>

<!-- SCREEN 1: VIDEO DREAM -->
<div class="screen" id="s1">
  <video id="dream-video" playsinline muted loop>
    <source src="/day/june/15/tingudreamv.mp4" type="video/mp4">
  </video>
  <div class="video-vignette"></div>
  <div class="dream-label">ek sapna tha -- aap aur main, apne ghar mein</div>
  <div class="video-tap-hint">tap to wake up</div>
</div>

<!-- SCREEN 2: LETTER -->
<div class="screen" id="s2">
  <div class="letter-header">
    <div class="letter-eyebrow">sirf aapke liye</div>
    <div class="letter-title">Ek Chitthi, Neend ke Baad</div>
  </div>

  <div class="letter-wrap">
    <img class="letter-img" src="/day/june/15/letter3.jpeg" alt="Letter for Tingu" />
  </div>

  <div class="letter-footer">
    <div class="letter-footer-text">
      jaldi aaunga, Tingu ji.<br>
      tab tak sapno mein milte hain.
    </div>
    <span class="heart-final">🌸</span>
  </div>
</div>

<script>
  // ── Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%; top:${Math.random()*100}%;
      --d:${2 + Math.random()*4}s;
      --op:${0.2 + Math.random()*0.7};
      animation-delay:${Math.random()*5}s;
    `;
    starsEl.appendChild(s);
  }

  // ── Particles (rose petals / sparkles)
  const particlesEl = document.getElementById('particles');
  const emojis = ['✦','·','˚','✧','⋆'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    p.style.cssText = `
      left:${Math.random()*100}%;
      color:rgba(201,137,154,${0.2+Math.random()*0.4});
      --pd:${6+Math.random()*10}s;
      animation-delay:${Math.random()*8}s;
    `;
    particlesEl.appendChild(p);
  }

  // ── Screens
  const s0 = document.getElementById('s0');
  const s1 = document.getElementById('s1');
  const s2 = document.getElementById('s2');
  const overlay = document.getElementById('dream-overlay');
  const video = document.getElementById('dream-video');
  const audioBtn = document.getElementById('audio-btn');
  const bgm = document.getElementById('bgm');

  let currentScreen = 0;
  let musicPlaying = false;

  function flashTransition(cb) {
    overlay.classList.add('flash');
    setTimeout(() => {
      cb();
      setTimeout(() => overlay.classList.remove('flash'), 600);
    }, 300);
  }

  function goToScreen(n) {
    flashTransition(() => {
      [s0, s1, s2].forEach(s => { s.classList.remove('active'); s.classList.add('exit'); });
      setTimeout(() => {
        [s0, s1, s2].forEach(s => s.classList.remove('exit'));
        const screens = [s0, s1, s2];
        screens[n].classList.add('active');
        currentScreen = n;

        if (n === 1) {
          video.play().catch(() => {});
          audioBtn.classList.add('visible');
          tryPlayMusic();
        }
        if (n === 2) {
          video.pause();
        }
      }, 100);
    });
  }

  // S0 tap
  s0.addEventListener('click', () => {
    if (currentScreen === 0) goToScreen(1);
  });

  // S1 tap
  s1.addEventListener('click', () => {
    if (currentScreen === 1) goToScreen(2);
  });

  // ── Music
  bgm.volume = 0.35;

  function tryPlayMusic() {
    bgm.play().then(() => {
      musicPlaying = true;
      audioBtn.textContent = '♪';
    }).catch(() => {});
  }

  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (musicPlaying) {
      bgm.pause();
      musicPlaying = false;
      audioBtn.textContent = '♩';
    } else {
      bgm.play();
      musicPlaying = true;
      audioBtn.textContent = '♪';
    }
  });

  // ── Preview mode bypass
  if (new URLSearchParams(location.search).get('preview') === 'true') {
    console.log('Preview mode on');
  }
</script>
</body>
</html>
